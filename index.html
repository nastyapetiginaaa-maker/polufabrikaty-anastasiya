<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Как приготовить — Домашние полуфабрикаты Анастасии</title><style>body{margin:0;background:#fffaf4;color:#30251f;font:16px Arial,sans-serif}header{padding:30px 18px;text-align:center;background:#f7eee5}h1{margin:0 0 8px}.wrap{max-width:760px;margin:auto;padding:20px 15px}.search{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ead9cc;border-radius:14px;font-size:16px;margin-bottom:15px}.card{background:#fff;border:1px solid #ead9cc;border-radius:18px;padding:17px;margin:12px 0}.card h2{margin:0 0 10px;font-size:21px}.tag{color:#a84b2f;font-size:13px}.steps li{margin:8px 0;line-height:1.45}.note{background:#f7eee5;padding:11px;border-radius:9px;margin-top:12px}.cats{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.cat{white-space:nowrap;padding:9px 12px;border:1px solid #ead9cc;border-radius:20px;background:white}.active{background:#a84b2f;color:white}</style></head><body><header><h1>Как приготовить</h1><div>Домашние полуфабрикаты Анастасии</div></header><main class="wrap"><input id="s" class="search" placeholder="🔎 Найти продукт..."><div id="c" class="cats"></div><div id="l"></div></main><script>const a=[
['Пельмени свино-говяжьи','Лепка',['Не размораживать.','Опустить в кипящую подсоленную воду.','После всплытия варить 5–7 минут.'],'Подавайте со сметаной или любимым соусом.'],
['Пельмени куриные','Лепка',['Не размораживать.','Опустить в кипящую подсоленную воду.','После всплытия варить 5–7 минут.']],
['Манты с говядиной и картофелем','Лепка',['Не размораживать.','Готовить на пару 35–40 минут.'],'Решётку слегка смажьте маслом.'],
['Хинкали с говядиной и свининой','Лепка',['Не размораживать.','Опустить в кипящую подсоленную воду.','После всплытия варить 8–10 минут.']],
['Вареники картошка / лук','Лепка',['Не размораживать.','Опустить в кипящую подсоленную воду.','После всплытия варить 3–5 минут.']],
['Вареники картошка / грибы','Лепка',['Не размораживать.','Опустить в кипящую подсоленную воду.','После всплытия варить 3–5 минут.']],
['Вареники творог / сыр / зелень','Лепка',['Не размораживать.','Опустить в кипящую подсоленную воду.','После всплытия варить 3–5 минут.']],
['Чебуреки','Лепка',['Не размораживать.','Жарить в хорошо разогретом масле на среднем огне до золотистой корочки с двух сторон.']],
['Блины с начинкой','Блины',['Разогреть сковороду с небольшим количеством масла.','Обжаривать с двух сторон до румяной корочки и горячей начинки.']],
['Сырники','Блины и сырники',['Готовить на среднем или слабом огне.','Обжарить с двух сторон до золотистой корочки.','Из замороженного состояния готовить на слабом огне.']],
['Тефтели','Мясные полуфабрикаты',['Обжарить до румяной корочки.','Добавить немного соуса или воды.','Накрыть и тушить 20–25 минут до полной готовности.']],
['Котлеты','Мясные полуфабрикаты',['Можно готовить из замороженного состояния.','Обжарить с двух сторон.','Убавить огонь, накрыть и довести до полной готовности.']],
['Котлета по-киевски','Мясные полуфабрикаты',['Сначала обязательно обжарить до золотистой корочки со всех сторон.','Затем довести до готовности в духовке или под крышкой на слабом огне.','Дать постоять 3–5 минут.'],'Не прокалывайте котлету во время приготовления.'],
['Гнёзда с грибами и сыром','Мясные полуфабрикаты',['Выложить в форму.','Запекать при 180°C около 20–25 минут до полной готовности.']],
['Голубцы','Мясные полуфабрикаты',['Выложить в форму или кастрюлю.','Добавить соус/воду.','Тушить под крышкой на слабом огне 40–50 минут.']],
['Фаршированный перец','Мясные полуфабрикаты',['Выложить в кастрюлю или форму.','Добавить соус/воду.','Тушить под крышкой на слабом огне 40–50 минут.']],
['Наггетсы','Мясные полуфабрикаты',['Не размораживать.','Обжарить в хорошо разогретом масле до золотистой корочки и полной готовности внутри.']],
['Куриные кармашки с ветчиной и сыром','Мясные полуфабрикаты',['Обжарить до румяной корочки.','Довести под крышкой на слабом огне или в духовке до полной готовности.']],
['Свинина по-французски','Мясные полуфабрикаты',['Запекать при 180°C до полной готовности мяса и румяной сырной корочки, примерно 30–40 минут.']],
['Свиные рулетики с беконом и сыром','Мясные полуфабрикаты',['Запекать при 180°C до полной готовности, примерно 30–40 минут.']]
];let cat='Все';const cats=['Все',...new Set(a.map(x=>x[1]))];function draw(){c.innerHTML=cats.map(x=>`<button class="cat ${x==cat?'active':''}" onclick="cat='${x}';draw()">${x}</button>`).join('');let q=s.value.toLowerCase();l.innerHTML=a.filter(x=>(cat=='Все'||x[1]==cat)&&x[0].toLowerCase().includes(q)).map(x=>`<article class="card"><span class="tag">${x[1]}</span><h2>${x[0]}</h2><ol class="steps">${x[2].map(y=>`<li>${y}</li>`).join('')}</ol>${x[3]?`<div class="note">💡 ${x[3]}</div>`:''}</article>`).join('')}s.oninput=draw;draw()</script></body></html>
