<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как приготовить — Домашние полуфабрикаты</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fffaf4,#1d1916);--surface:light-dark(#ffffff,#28221e);--surface2:light-dark(#f7eee5,#332a25);--text:light-dark(#30251f,#fff7f0);--muted:light-dark(#74665e,#cdbfb6);--accent:light-dark(#a84b2f,#e98967);--border:light-dark(#ead9cc,#4a3b33)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}#app{min-height:100vh;background:var(--bg)}header{padding:34px 20px 22px;text-align:center;background:var(--surface2)}h1{margin:0 0 8px;font-size:30px}header p{margin:0;color:var(--muted);font-size:15px}.wrap{max-width:760px;margin:auto;padding:22px 16px 45px}.search{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:16px;margin-bottom:16px}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin-bottom:18px}.cat{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}.cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #00000008}.card h2{margin:0 0 8px;font-size:21px}.tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--surface2);border-radius:999px;padding:5px 8px;margin-bottom:10px}.steps{margin:0;padding-left:20px}.steps li{margin:8px 0;line-height:1.45}.note{margin-top:13px;padding:11px 12px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:8px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:30px}.brand{font-weight:700;color:var(--accent)}
</style>
</head>
<body><div id="app">
<header><h1>Как приготовить</h1><p>Домашние полуфабрикаты <span class="brand">Анастасии</span></p></header>
<main class="wrap"><input id="search" class="search" placeholder="🔎 Найти продукт..."><div id="cats" class="cats"></div><section id="list"></section></main>
<script>
const items=[
{name:'Пельмени свино-говяжьи',cat:'Лепка',steps:['Не размораживать.','Опустить в кипящую подсоленную воду, аккуратно перемешать.','После всплытия варить 5–7 минут.'],note:'Подавайте со сметаной, маслом или любимым соусом.'},
{name:'Пельмени куриные',cat:'Лепка',steps:['Не размораживать.','Опустить в кипящую подсоленную воду.','После всплытия варить 5–7 минут.']},
{name:'Манты с говядиной и картофелем',cat:'Лепка',steps:['Не размораживать.','Готовить на пару в кипящей воде.','Время приготовления — примерно 35–40 минут.'],note:'Решётку слегка смажьте маслом, чтобы тесто не прилипало.'},
{name:'Хинкали с говядиной и свининой',cat:'Лепка',steps:['Не размораживать.','Опустить в кипящую подсоленную воду и после забрасывания аккуратно перемешать, чтобы не пристали ко дну.','После всплытия варить около 8–10 минут.'],note:'Вынимайте аккуратно, чтобы не повредить тесто.'},
{name:'Вареники — картошка / лук, картошка / грибы, творог / сыр / зелень',cat:'Лепка',steps:['Не размораживать.','Опустить в кипящую подсоленную воду.','После всплытия варить 3–5 минут.']},
{name:'Чебуреки',cat:'Лепка',steps:['Не размораживать.','Жарить в хорошо разогретом растительном масле на среднем огне до золотистой корочки с двух сторон.','Готовность проверяйте по румяной корочке и полной прожарке начинки.']},
{name:'Блины с начинкой',cat:'Блины',steps:['Можно готовить без полной разморозки.','Разогреть сковороду, добавить немного масла.','Обжаривать на среднем огне с двух сторон до румяной корочки и горячей начинки.'],note:'Для сладких блинов используйте слабый/средний огонь, чтобы начинка прогрелась и блин не подгорел.'},
{name:'Сырники',cat:'Блины и сырники',steps:['Готовить на среднем или слабом огне.','Сначала обжарить со стороны с узором.','Затем перевернуть и обжарить с другой стороны до золотистой корочки.'],note:'Из замороженного состояния готовьте на более слабом огне, чтобы сырники прогрелись внутри.'},
{name:'Тефтели',cat:'Мясные полуфабрикаты',steps:['Не размораживать полностью.','Обжарить до румяной корочки.','Добавить соус или немного воды, накрыть крышкой и тушить до полной готовности, примерно 20–25 минут.']},
{name:'Котлеты',cat:'Мясные полуфабрикаты',steps:['Можно готовить из замороженного состояния.','Обжарить на среднем огне с двух сторон до румяной корочки.','Убавить огонь, накрыть крышкой и довести до полной готовности.'],note:'Толстые котлеты готовьте дольше на слабом огне.'},
{name:'Котлета по-киевски',cat:'Мясные полуфабрикаты',steps:['Сначала обязательно обжарить на сковороде до золотистой корочки со всех сторон.','Затем довести до готовности в духовке.','Перед подачей дать постоять 3–5 минут.'],note:'Не прокалывайте котлету во время приготовления, чтобы масло внутри не вытекло.'},
{name:'Гнёзда с грибами и сыром',cat:'Мясные полуфабрикаты',steps:['Выложить полуфабрикаты в форму.','Запекать в разогретой до 180°C духовке около 20–25 минут.','Готовность проверять по полной прожарке куриного фарша и расплавленному сыру.']},
{name:'Голубцы',cat:'Мясные полуфабрикаты',steps:['Выложить в форму или кастрюлю.','Добавить соус/воду так, чтобы голубцы были частично покрыты.','Тушить под крышкой на слабом огне до полной готовности, ориентировочно 40–50 минут.']},
{name:'Фаршированный перец',cat:'Мясные полуфабрикаты',steps:['Выложить перцы в кастрюлю или форму.','Добавить соус/воду.','Тушить под крышкой на слабом огне до полной готовности, ориентировочно 40–50 минут.']},
{name:'Наггетсы',cat:'Мясные полуфабрикаты',steps:['Не размораживать.','Обжарить в хорошо разогретом масле до золотистой корочки и полной готовности внутри.','После приготовления выложить на бумажное полотенце.']},
{name:'Печёночные рулетики',cat:'Мясные полуфабрикаты',steps:['Разморозить в микроволновке.','Готовы к употреблению.']},
{name:'Куриные кармашки с ветчиной и сыром',cat:'Мясные полуфабрикаты',steps:['Обжарить на среднем огне до румяной корочки.','Затем довести под крышкой на слабом огне или в духовке до полной готовности.']},
{name:'Свинина по-французски',cat:'Мясные полуфабрикаты',steps:['Выложить в форму.','Запекать при 180°C 30 минут до полной готовности мяса и румяной сырной корочки.']},
{name:'Свиные рулетики с беконом и сыром',cat:'Мясные полуфабрикаты',steps:['Выложить в форму.','Запекать при 180°C до полной готовности, ориентировочно 30–40 минут.','Перед подачей дать постоять несколько минут.']}
];
const cats=['Все',...new Set(items.map(x=>x.cat))];let active='Все';
const catsEl=document.getElementById('cats'),list=document.getElementById('list'),search=document.getElementById('search');
function drawCats(){catsEl.innerHTML=cats.map(c=>`<button class="cat ${c===active?'active':''}" onclick="setCat('${c.replaceAll("'","\\'")}')">${c}</button>`).join('')}
function setCat(c){active=c;drawCats();draw()}
function draw(){const q=search.value.toLowerCase().trim();const arr=items.filter(x=>(active==='Все'||x.cat===active)&&x.name.toLowerCase().includes(q));list.innerHTML=arr.length?arr.map(x=>`<article class="card"><span class="tag">${x.cat}</span><h2>${x.name}</h2><ol class="steps">${x.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${x.note?`<div class="note">💡 ${x.note}</div>`:''}</article>`).join(''):'<div class="empty">Ничего не найдено. Попробуйте другое название.</div>'}
search.addEventListener('input',draw);drawCats();draw();
</script></div></body></html>
